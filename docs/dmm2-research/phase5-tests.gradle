// Local focused harness: real Gradle Test/JUnit, current changed classes first; no unrelated source compilation.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def output = new File(root.rootDir, 'build/dmm2/phase5-classes')
    [':game', ':game:plugins'].each { name ->
        def project = root.project(name)
        def test = project.tasks.getByName('test')
        def runtime = test.classpath.files.toList()
        test.setDependsOn([])
        test.testClassesDirs = root.files(output)
        test.classpath = root.files(output, runtime)
        test.outputs.upToDateWhen { false }
    }
    root.project(':game:plugins').tasks.getByName('test').mustRunAfter(root.project(':game').tasks.getByName('test'))
}

// When explicitly requested, compile only the nine selected scripts against the current preflight classes.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def output = new File(root.rootDir, 'build/dmm2/phase5-classes')
    def task = root.project(':game:plugins:scripts').tasks.getByName('compileKotlin')
    def libraries = task.libraries.files.toList()
    task.setDependsOn([])
    task.libraries.setFrom(root.files(output, libraries))
    root.project(':game:plugins').tasks.getByName('test').mustRunAfter(task)
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    [':game', ':game:plugins'].each { name ->
        def task = root.project(name).tasks.getByName('test')
        task.systemProperty 'rsps.data', root.file('data').absolutePath
        // Isolate global installed contracts and cache-backed static DefinitionSets across test classes.
        task.forkEvery = 1
    }
}
