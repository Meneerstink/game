players:

  updating-opcode: 69
  excess-mask: 0x80

  # Exact read order of the 667 client, PlayerList.processExtendedInfo (flag names from
  # com.jagex.core.constants.PlayerExtendedInfoFlag). Blocks the server does not send are omitted.
  order:
    - ANIMATION # ANIMATION 0x40
    - GFX_3 # SPOTANIM2 0x40000
    - MOVEMENT # TEMP_SPEED 0x200
    - GFX_4 # SPOTANIM3 0x80000
    - HITMARK # HITMARK 0x4
    - APPEARANCE # APPEARANCE 0x8
    - FORCE_CHAT # CHAT 0x4000
    - MOVEMENT_TYPE # SPEED 0x1
    - FACE_PAWN # TARGET 0x10
    - FORCE_MOVEMENT # EXACT_MOVE 0x1000
    - FACE_TILE # TURN 0x20
    - GFX # SPOTANIM0 0x2
    - GFX_2 # SPOTANIM1 0x100

  blocks:

    - block: ANIMATION
      bit: 0x40
      structure:
        - name: animation
          order: LITTLE
          type: SHORT
        - name: animation_2
          order: LITTLE
          type: SHORT
        - name: animation_3
          order: LITTLE
          type: SHORT
        - name: animation_4
          order: LITTLE
          type: SHORT
        - name: delay
          type: BYTE
          trans: ADD

    - block: MOVEMENT
      bit: 0x200
      structure:
        - name: type
          type: BYTE
          trans: NEGATE

    - block: FORCE_CHAT
      bit: 0x4000

    - block: HITMARK
      bit: 0x4
      structure:
        - name: hitmarks
          type: BYTE
        - name: hitbar_percentage
          type: BYTE
          trans: NEGATE

    - block: APPEARANCE
      bit: 0x8
      structure:
        - name: length
          type: BYTE
          trans: SUBTRACT
        - name: buffer
          type: BYTES

    - block: MOVEMENT_TYPE
      bit: 0x1
      structure:
        - name: type
          type: BYTE
          trans: SUBTRACT

    - block: FACE_TILE
      bit: 0x20
      structure:
        - name: degrees
          type: SHORT

    - block: FACE_PAWN
      bit: 0x10
      structure:
        - name: pawn_index
          type: SHORT
          trans: ADD

    - block: FORCE_MOVEMENT
      bit: 0x1000
      structure:
        - name: src_x
          type: BYTE
          trans: SUBTRACT
        - name: src_z
          type: BYTE
        - name: dst_x
          type: BYTE
          trans: ADD
        - name: dst_z
          type: BYTE
          trans: ADD
        - name: client_delay
          type: SHORT
          order: LITTLE
        - name: client_duration
          type: SHORT
          order: LITTLE
          trans: ADD
        - name: direction_angle
          type: BYTE
          trans: ADD

    # Four spot-anim slots (client PlayerList: SPOTANIM0..3). id / heightAndDelay / data byte.
    # SPOTANIM0 reads g2, g4_alt1, g1_alt1 (the data byte was NEGATE here; the client subtracts 128).
    - block: GFX
      bit: 0x2
      structure:
        - name: gfx
          type: SHORT
        - name: settings
          order: LITTLE
          type: INT
        - name: rotation
          type: BYTE
          trans: ADD

    # SPOTANIM1: g2_alt3, g4_alt3, g1_alt2
    - block: GFX_2
      bit: 0x100
      structure:
        - name: gfx
          type: SHORT
          order: LITTLE
          trans: ADD
        - name: settings
          type: INT
          order: INVERSED_MIDDLE
        - name: rotation
          type: BYTE
          trans: NEGATE

    # SPOTANIM2: g2_alt3, g4_alt3, g1_alt2
    - block: GFX_3
      bit: 0x40000
      structure:
        - name: gfx
          type: SHORT
          order: LITTLE
          trans: ADD
        - name: settings
          type: INT
          order: INVERSED_MIDDLE
        - name: rotation
          type: BYTE
          trans: NEGATE

    # SPOTANIM3: ig2, g4_alt3, g1_alt2
    - block: GFX_4
      bit: 0x80000
      structure:
        - name: gfx
          type: SHORT
          order: LITTLE
        - name: settings
          type: INT
          order: INVERSED_MIDDLE
        - name: rotation
          type: BYTE
          trans: NEGATE

npcs:

  updating-opcode: 6

  # Exact read order of the 667 client, NPCList.processExtendedInfo (NpcExtendedInfoFlag).
  order:
    - GFX_3 # SPOTANIM_2 0x100000
    - FACE_PAWN # 1
    - GFX_4 # SPOTANIM3 0x20000
    - HITMARK # 3
    - APPEARANCE # 6
    - FORCE_CHAT # 7
    - FACE_TILE # 8
    - COMBAT_LEVEL # 10
    - ANIMATION # 11
    - GFX_2 # SPOTANIM1 0x1000
    - GFX # 15

  blocks:
    - block: FACE_PAWN
      bit: 0x1
      structure:
        - name: pawn_index
          order: LITTLE
          type: SHORT

    - block: HITMARK
      bit: 0x40
      structure:
        - name: hitmarks
          type: BYTE
          trans: NEGATE
        - name: hitbar_percentage
          type: BYTE

    - block: APPEARANCE
      bit: 0x20
      structure:
        - name: transmog
          order: LITTLE
          type: SHORT

    - block: FORCE_CHAT
      bit: 0x2

    - block: FACE_TILE
      bit: 0x8
      structure:
        - name: x
          order: LITTLE
          type: SHORT
        - name: z
          order: LITTLE
          type: SHORT

    # NpcExtendedInfoFlag.COMBAT_LEVEL. Read by NPCList as a single ig2() - little-endian
    # unsigned short - directly after TURN_TO and before ANIMATE, which is where it sits in the
    # order above. The bit is in the third mask byte, so sending it also forces the 0x80 and
    # 0x8000 mask-extension markers; see NpcUpdateBlockSegment.
    - block: COMBAT_LEVEL
      bit: 0x80000
      structure:
        - name: combat_level
          order: LITTLE
          type: SHORT

    - block: ANIMATION
      bit: 0x10
      structure:
        - name: animation
          type: SHORT
        - name: animation_2
          type: SHORT
        - name: animation_3
          type: SHORT
        - name: animation_4
          type: SHORT
        - name: delay
          type: BYTE

    # Four spot-anim slots (client NPCList: SPOTANIM0..3). SPOTANIM0: ig2, g4_alt3, g1_alt2
    - block: GFX
      bit: 0x4
      structure:
        - name: gfx
          type: SHORT
          order: LITTLE
        - name: settings
          type: INT
          order: INVERSED_MIDDLE
        - name: rotation
          type: BYTE
          trans: NEGATE

    # SPOTANIM1: g2_alt2, g4, g1
    - block: GFX_2
      bit: 0x1000
      structure:
        - name: gfx
          type: SHORT
          trans: ADD
        - name: settings
          type: INT
        - name: rotation
          type: BYTE

    # SPOTANIM_2: g2, g4, g1_alt1
    - block: GFX_3
      bit: 0x100000
      structure:
        - name: gfx
          type: SHORT
        - name: settings
          type: INT
        - name: rotation
          type: BYTE
          trans: ADD

    # SPOTANIM3: g2, g4, g1
    - block: GFX_4
      bit: 0x20000
      structure:
        - name: gfx
          type: SHORT
        - name: settings
          type: INT
        - name: rotation
          type: BYTE