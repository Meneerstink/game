# Staff command list (::commands). Generated 2026-10-10 from the on_command bindings; one entry per command.
# rank: player | moderator | admin | owner  (the lowest rank that may use it)
# category: players | punish | teleport | info  (A17: the tab of the ::mod window; none = only found by Search)
# Not fully understood (described from what the code visibly does): devdeco (place-mode keys are handled in DecoPlacer); pohdev (many sub-options); hudtour (tour steps not fully read); questpanel (button protocol of the Quest Helper panel).
- name: clearspawns
  rank: owner
  usage: "::clearspawns"
  description: "Remove every test NPC/object spawned with ::npc or ::obj (and hitsplats) this session."
  example: "::clearspawns"
- name: completequests
  rank: moderator
  usage: "::completequests"
  description: "Test tool: mark every implemented quest as completed on your account (with rewards). Owner, and the moderators Hakim and sous only."
  example: "::completequests"
- name: drainskills
