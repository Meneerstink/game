# New-player foundation (2026-09-26): XP rates, the AFK skill area under the Grand Exchange hall, the Summoning kit the
# Quest Guide hands out once, the quest-choice npc and the Deadman Mode starter chest. The running server reads this file
# at boot (NewPlayerConfig); a value missing here falls back to the default written next to it.

# N92 (owner 2026-10-17): the XP rate is the Deadman Annihilation tier (combat 10x/15x/15x/20x per combat bracket, skilling
# 10x), one table in plugins mechanics/pvp/annihilation/AnnihilationTier.kt; the old xp.normal_rate knob, the level curve and
# the time-played bonus are gone. Only the AFK area below keeps its own fixed numbers.

afk_area:
  # XP per game tick (0.6 s) while a player trains at a station in the AFK area, multiplied by rate. This XP is added
  # raw: the Annihilation XP rate does NOT apply, so what you set here is exactly what players get.
  # Default 30 per tick = 180,000 XP an hour; level 55 (166,636 XP) takes about 55 minutes from level 1.
  # OWNER: fill in the Skilling Basement XP rate you want - these two values are defaults (the same for all 15 skills);
  # rate multiplies xp_per_tick. The server reads them at boot.
  rate: 1.0
  xp_per_tick: 30
  # Training stops exactly at the XP of this level (never above it) and a skill already at it cannot train here.
  level_cap: 55

summoning_kit:
  # The Quest Guide hands every account this kit once, together with the Wolf Whistle completion. The amounts are
  # computed from the plan below: pouches are infused level by level (each pouch's cache XP times
  # the account's own Annihilation XP rate) until target_level is reached, and each pouch needs its charm, its
  # spirit shards, one empty pouch and its tertiary. A plan row uses the pouch from its level until the next row starts.
  target_level: 55
  plan:
    - { pouch: SPIRIT_WOLF, from_level: 1 }
    - { pouch: GRANITE_CRAB, from_level: 16 }
    - { pouch: BULL_ANT, from_level: 40 }
    - { pouch: SPIRIT_TERRORBIRD, from_level: 52 }

choice_npc:
  # The npc the new-player intro sends players to for the permanent quest choices, the Summoning kit and quest lamps.
  # Change the id or the tile here to move or replace it (14482 = the quest-cape "Quest Guide", QuestGuideNpcTool;
  # 949 = the plain cache one); facing is n, e, s or w.
  # Owner 2026-09-30 (developer mode): west of the fountain, facing south.
  npc: 14482
  x: 3162
  z: 3491
  level: 0
  facing: s

starter_chest:
  # The Deadman Mode starter chest the intro hands out (NewPlayerStart.grantStarterPack). item 23881 = OSRS item 22330 "Deadman
  # starter pack" (OSRS Wiki), imported by OsrsItemImportTool batch starter-pack (tx-20260926-161950).
  # contents: item id and amount per row (the owner's own pack, not the OSRS one).
  item: 23881
  contents:
    # Owner 2026-10-22 (N173/N179): 1m coins, 100 house tablets and the Deadman's skull, all into the inventory.
    - { item: 995, amount: 1000000 }  # Coins (the 1m starter cash, no longer put in the bank)
    - { item: 8013, amount: 100 }     # Teleport to house
    - { item: 23856, amount: 1 }  # Deadman's skull
