  # ClientProt FRIENDS_CHAT_CHANGE(1, -1): joining a friends-chat channel, and leaving it.
  # Payload is a byte holding the length of the channel-owner name followed by that name; on leave
  # the client writes only a zero byte and no name at all, so ClanJoinChatLeaveChatDecoder reads
  # this by hand rather than through the declarative structure below.
  #
  # Registering it matters beyond the feature: GamePacketDecoder answers an unknown opcode by
  # discarding every byte currently readable, so an unregistered packet silently eats whatever
  # unrelated packets happened to arrive in the same read.
  - message: gg.rsmod.game.message.impl.ClanJoinChatLeaveChatMessage
    type: VARIABLE_BYTE
    opcode: 1
    structure:
        - name: name
          type: STRING

