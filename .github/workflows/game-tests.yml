name: Game tests

on:
  push:
    branches:
      - codex/account-persistence-hardening
  pull_request:
    branches:
      - main

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Run game tests
        run: ./gradlew :game:test --tests gg.rsmod.game.service.serializer.json.JsonPlayerSaveStoreTests --no-daemon
