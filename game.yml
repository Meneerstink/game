# Game values
# You want to edit these to fit your game.
name: "78"
game-port: 50015
revision: 667

commandServer:
    tcpPort: 50017

# The coordinates for the home location.
# BATCH 1: home-z moved from 3640 to 3616 so the enclave's centre sits 24 tiles further south
# (SAFE_RADIUS grew 5->24) while the auto-derived north gate (home.z + SAFE_RADIUS) still lands
# exactly on the preserved Tile(3140, 3640, 0) BH/Wilderness connection point.
# Ferox Enclave (imported into map squares 12344/12600): arrival tile on the open plaza east of
# the bank chest. The safe zone is the enclave footprint itself (plugins areas/home/BountyHunterHome.kt).
home-x: 3164
home-z: 3487
home-height: 0

# Privileges
# Any privilege you want to be represented in-game you define here.
privileges:
  - id: 0
    icon: 0
    name: "player"
    powers: []
  - id: 1
    icon: 1
    name: "moderator"
    powers: ["mod"]
  - id: 2
    icon: 2
    name: "administrator"
    powers: ["mod", "admin"]
  - id: 3
    icon: 2
    name: "owner"
    powers: ["mod", "dev", "admin", "owner"]

# Game services
# You can pick and choose which services you want to run.
services:
  - class: gg.rsmod.game.service.serializer.json.JsonPlayerSerializer

  - class: gg.rsmod.game.service.xtea.XteaKeyService

  - class: gg.rsmod.game.service.game.ItemMetadataService

  - class: gg.rsmod.game.service.game.NpcMetadataService

  - class: gg.rsmod.game.service.game.ObjectMetadataService

  - class: gg.rsmod.game.service.game.DumpEntityIdService

    cache-path: "./data/cache/"
    output-path: "./game/plugins/src/main/kotlin/gg/rsmod/plugins/api/cfg/"
    dump: false

  - class: gg.rsmod.plugins.content.mechanics.exchange.GrandExchangeService

  # OSRS-style password recovery (e-mail code + recovery page). Switched off until smtp-host is filled in, e.g.
  # smtp-host: "smtp-relay.brevo.com" / smtp-port: 465 / smtp-user / smtp-password / mail-from / public-url.
  - class: gg.rsmod.game.service.recovery.AccountRecoveryService
    http-port: 50078

  - class: gg.rsmod.game.service.rsa.RsaService

  - class: gg.rsmod.game.service.GameService

  - class: gg.rsmod.game.service.login.LoginService

  - class: gg.rsmod.game.service.log.FileLoggerService
