plugins {
    id 'org.jetbrains.dokka'
}

sourceSets {
    main {
        kotlin.exclude '**/*.plugin.kts'
    }
}

dependencies {
    implementation project(':game')
    implementation project(':net')
    implementation project(':util')
    implementation "it.unimi.dsi:fastutil:$fastUtilVersion"
    testImplementation 'io.mockk:mockk:1.13.4'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kcoroutineVersion"
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:1.8.0"
}

// Several content tests load a full cache-backed DefinitionSet each (containers, death recovery,
// shops, summoning, ...). The default 512m test worker heap cannot hold them all in one JVM.
// Raised from 2g to 3g on 2026-09-07 when the Summoning completeness gates added another
// cache-backed class and the suite started failing with OutOfMemoryError in a different, random
// class on each run.
test {
    // Extra headroom for cache-backed suites; keep a single test worker on the 16 GB host.
    maxHeapSize = '4g'
    maxParallelForks = 1
    // A fresh test JVM every 25 classes: cache-backed test classes keep full DefinitionSets in companion objects, and the single
    // worker of a full `:game:plugins:test` run reached its 4 GB cap and stalled (2026-09-14 regression: HandCannonTests stuck in
    // GC, TravelNetworkCacheTests / TrouverTests class setup failed; all pass alone).
    forkEvery = 25
}

dokka {
    for (def pkg : ["gg.rsmod.plugins.api.cfg"]) {
        packageOptions {
            prefix = pkg
            suppress = true
        }
    }
}
